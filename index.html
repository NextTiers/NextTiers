<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexTiers — Sword Tierlist</title>
<link rel="preconnect" href="https://mc-heads.net" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0c10;
    color: #e6e8ee;
    line-height: 1.55;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }

  /* ===== NAVBAR ===== */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10, 12, 16, 0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid #161a22;
  }
  .navbar-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 20px;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .logo-mark {
    width: 42px; height: 42px;
    border-radius: 50%;
    overflow: hidden;
    background: #0a0c10;
    box-shadow: 0 0 0 2px #0a0c10, 0 0 0 3px #2a2416;
    flex-shrink: 0;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .logo:hover .logo-mark {
    transform: scale(1.06);
    box-shadow: 0 0 0 2px #0a0c10, 0 0 0 3px #d4a017, 0 0 20px rgba(255, 209, 102, 0.35);
  }
  .logo-mark img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }
  .nav-actions { display: flex; align-items: center; gap: 10px; }
  .nav-btn {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: #12161f;
    border: 1px solid #1c2029;
    display: grid; place-items: center;
    cursor: pointer;
    transition: background .2s ease, transform .2s ease, border-color .2s ease;
  }
  .nav-btn:hover {
    background: #1a1f2b;
    transform: translateY(-1px);
    border-color: #2a3140;
  }
  .nav-btn:active { transform: translateY(0) scale(0.96); }
  .nav-btn svg { stroke: #a0a8ba; transition: stroke .2s ease; }
  .nav-btn.discord-btn {
    background: #5865F2;
    border-color: #5865F2;
  }
  .nav-btn.discord-btn:hover {
    background: #4752c4;
    border-color: #4752c4;
    box-shadow: 0 6px 18px rgba(88, 101, 242, 0.35);
  }
  .nav-btn.discord-btn svg { stroke: none; fill: #fff; }

  /* ===== PAGE ===== */
  .page {
    flex: 1;
    display: flex;
    flex-direction: column;
    opacity: 1;
    transform: translateY(0);
    transition: opacity .35s ease, transform .35s ease;
  }
  .page.leaving {
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
  }
  .page.entering {
    opacity: 0;
    transform: translateY(8px);
  }

  /* ===== HERO ===== */
  .hero {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px 40px;
    text-align: center;
    overflow: hidden;
  }
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(700px 400px at 50% 0%, rgba(255, 209, 102, 0.05), transparent 60%),
      radial-gradient(600px 400px at 50% 100%, rgba(0, 180, 216, 0.04), transparent 60%);
    pointer-events: none;
  }
  .hero > * { position: relative; z-index: 1; }

  .hero-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #d4a017;
    margin-bottom: 22px;
    opacity: 0;
    animation: fadeUp .6s ease .1s forwards;
  }
  .hero h1 {
    font-size: clamp(2rem, 7vw, 3.6rem);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -1.5px;
    max-width: 620px;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp .6s ease .2s forwards;
  }
  .hero p {
    color: #8b94a7;
    font-size: 1rem;
    max-width: 560px;
    margin-bottom: 38px;
    opacity: 0;
    animation: fadeUp .6s ease .3s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== CTA ===== */
  .cta-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 44px;
    opacity: 0;
    animation: fadeUp .6s ease .4s forwards;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 14px 26px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.96rem;
    font-family: inherit;
    border: none;
    cursor: pointer;
    transition: transform .18s ease, filter .18s ease, background .18s ease, box-shadow .18s ease;
    text-decoration: none;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0) scale(0.97); }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary {
    background: linear-gradient(135deg, #ffd166, #e6b800);
    color: #1a1400;
    box-shadow: 0 8px 24px rgba(255, 209, 102, 0.22);
  }
  .btn-primary:hover {
    filter: brightness(1.08);
    box-shadow: 0 12px 30px rgba(255, 209, 102, 0.35);
  }
  .btn-secondary {
    background: #161a22;
    color: #e6e8ee;
    border: 1px solid #232a37;
  }
  .btn-secondary:hover {
    background: #1c2230;
    border-color: #2a3140;
  }

  /* ===== SEARCH ===== */
  .search-hero {
    width: 100%;
    max-width: 620px;
    position: relative;
    opacity: 0;
    animation: fadeUp .6s ease .5s forwards;
  }
  .search-hero > svg {
    position: absolute;
    left: 16px; top: 50%;
    transform: translateY(-50%);
    width: 17px; height: 17px;
    stroke: #6d7688;
    pointer-events: none;
    transition: stroke .2s ease;
  }
  .search-hero input {
    width: 100%;
    padding: 15px 18px 15px 46px;
    background: #12161f;
    border: 1px solid #1e2431;
    border-radius: 13px;
    color: #e6e8ee;
    font-size: 0.96rem;
    font-family: inherit;
    outline: none;
    transition: border-color .25s ease, box-shadow .25s ease;
  }
  .search-hero input:focus {
    border-color: #d4a017;
    box-shadow: 0 0 0 4px rgba(255, 209, 102, 0.08);
  }
  .search-hero input::placeholder { color: #5a6377; }

  .search-results {
    position: absolute;
    top: calc(100% + 8px);
    left: 0; right: 0;
    background: #12161f;
    border: 1px solid #1e2431;
    border-radius: 13px;
    max-height: 320px;
    overflow-y: auto;
    z-index: 50;
    display: none;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity .2s ease, transform .2s ease;
  }
  .search-results.open {
    display: block;
    opacity: 1;
    transform: translateY(0);
  }
  .search-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    cursor: pointer;
    transition: background .15s ease;
    text-align: left;
    opacity: 0;
    animation: fadeUp .3s ease forwards;
  }
  .search-item:nth-child(1) { animation-delay: .02s; }
  .search-item:nth-child(2) { animation-delay: .05s; }
  .search-item:nth-child(3) { animation-delay: .08s; }
  .search-item:nth-child(4) { animation-delay: .11s; }
  .search-item:nth-child(5) { animation-delay: .14s; }
  .search-item:nth-child(6) { animation-delay: .17s; }
  .search-item:nth-child(7) { animation-delay: .20s; }
  .search-item:nth-child(8) { animation-delay: .23s; }
  .search-item:hover { background: #1a1f2b; }
  .search-item img {
    width: 34px; height: 34px;
    border-radius: 8px;
    image-rendering: pixelated;
    background: #1a1f2b;
    box-shadow: inset 0 0 0 1px #262c38;
  }
  .search-item-name { font-weight: 600; font-size: 0.92rem; }
  .search-item-tier {
    margin-left: auto;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(255, 209, 102, 0.12);
    color: #ffd166;
  }
  .search-item-tier.retired {
    background: rgba(255, 107, 107, 0.12);
    color: #ff6b6b;
  }
  .search-empty {
    padding: 20px 16px;
    text-align: center;
    color: #6d7688;
    font-size: 0.88rem;
  }

  /* ===== BOARD ===== */
  .board-wrap {
    flex: 1;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding: 26px 20px 80px;
  }

  /* ===== RANK CARD ===== */
  .rank-card {
    position: relative;
    background: #0f131b;
    border: 1px solid #161a22;
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: border-color .25s ease, transform .25s ease, box-shadow .25s ease;
    opacity: 0;
    transform: translateY(18px);
    will-change: opacity, transform;
  }
  .rank-card.visible {
    opacity: 1;
    transform: translateY(0);
    transition: opacity .5s ease, transform .5s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .rank-card:hover {
    border-color: #232a37;
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
  }
  .rank-card.flash {
    border-color: #ffd166 !important;
    box-shadow: 0 0 0 3px rgba(255, 209, 102, 0.2);
  }

  .rank-badge {
    position: absolute;
    top: 0; left: 0;
    width: 78px; height: 78px;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    padding: 8px 0 0 10px;
    font-weight: 900;
    font-size: 1.5rem;
    color: #1a1400;
    clip-path: polygon(0 0, 100% 0, 0 100%);
  }
  .rank-1 { background: linear-gradient(135deg, #ffd166, #e6b800); }
  .rank-2 { background: linear-gradient(135deg, #d8dee9, #a8b3c4); }
  .rank-3 { background: linear-gradient(135deg, #e0965a, #c67a3f); }
  .rank-other {
    background: transparent;
    color: #4a5568;
    font-size: 1.15rem;
    clip-path: none;
    padding: 16px 0 0 18px;
  }

  .rank-main {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-left: 62px;
  }
  .rank-skin {
    width: 64px; height: 64px;
    border-radius: 12px;
    background: #1a1f2b;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px #262c38;
    flex-shrink: 0;
    transition: transform .25s ease;
  }
  .rank-card:hover .rank-skin { transform: scale(1.05); }
  .rank-skin img {
    width: 100%; height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .rank-info { min-width: 0; flex: 1; }

  .rank-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .rank-name {
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: -0.3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  /* Плашка Retired — без креста */
  .retired-tag {
    display: inline-flex;
    align-items: center;
    font-size: 0.65rem;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 5px;
    background: rgba(255, 107, 107, 0.1);
    color: #ff6b6b;
    border: 1px solid rgba(255, 107, 107, 0.25);
  }

  .rank-tier-line {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
  }
  .rank-tier-badge {
    font-size: 0.85rem;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 6px;
    letter-spacing: 0.3px;
  }
  .rank-tier-label {
    font-size: 0.75rem;
    color: #5a6377;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Разделитель секции */
  .section-divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 32px 0 16px;
    opacity: 0;
    animation: fadeUp .5s ease forwards;
  }
  .section-divider .line {
    flex: 1;
    height: 1px;
    background: #1c2029;
  }
  .section-divider .label {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #ff6b6b;
  }
  .section-divider .label.active-label { color: #ffd166; }

  /* Цвета тиров */
  .t-ht1 { background: #ffd166; color: #1a1400; }
  .t-lt1 { background: #ffe08a; color: #1a1400; }
  .t-ht2 { background: #d8dee9; color: #14161a; }
  .t-lt2 { background: #b9c2d0; color: #14161a; }
  .t-ht3 { background: #e0965a; color: #241206; }
  .t-lt3 { background: #c58354; color: #241206; }
  .t-ht4 { background: #4a5568; color: #e6e8ee; }
  .t-lt4 { background: #333c4c; color: #c7cdda; }
  .t-ht5 { background: #2a3140; color: #a7b0c2; }
  .t-lt5 { background: #1e2431; color: #8b94a7; }

  .hidden { display: none !important; }

  @media (max-width: 600px) {
    .navbar-inner { padding: 0 14px; }
    .logo { font-size: 0.95rem; letter-spacing: 1px; }
    .logo-mark { width: 38px; height: 38px; }
    .hero { padding: 40px 16px 30px; }
    .board-wrap { padding: 18px 14px 60px; }
    .btn { padding: 13px 20px; font-size: 0.9rem; }
    .rank-main { padding-left: 56px; gap: 12px; }
    .rank-skin { width: 54px; height: 54px; }
    .rank-name { font-size: 1.02rem; }
  }
</style>
</head>
<body>

  <div class="navbar-inner">

</section>

<section class="page hidden" id="boardPage">
  <div class="board-wrap">
    <div id="boardList"></div>
  </div>

<script>

const PLAYERS = [
  { name: "AlexPvP",      uuid: "c06f89064c8a49119c29ea1dbd1aab82", points: 165, tier: "HT1", retired: false },
  { name: "Steve_Pro",    uuid: "ec561538f3fd461daffd1e8e5f4b8b8a", points: 152, tier: "HT1", retired: false },

/* ============================================================
   ХЕЛПЕРЫ
   ============================================================ */
const TIER_ORDER = ["HT1","LT1","HT2","LT2","HT3","LT3","HT4","LT4","HT5","LT5"];

function skinUrl(p, size) { return `https://mc-heads.net/avatar/${p.uuid}/${size}`; }
function skinFallback(p) { return `https://mc-heads.net/avatar/${encodeURIComponent(p.name)}/128`; }
function tierClass(t) { return "t-" + t.toLowerCase(); }
function tierRank(t) {
  const i = TIER_ORDER.indexOf(t);
  return i === -1 ? 999 : i;
}
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

/* ============================================================
   ПЛАВНЫЙ ПЕРЕХОД
   ============================================================ */
let isAnimating = false;

function switchPage(hideId, showId, afterSwitch) {
  if (isAnimating) return;
  isAnimating = true;

  const hideEl = document.getElementById(hideId);
  const showEl = document.getElementById(showId);

  hideEl.classList.add("leaving");

  setTimeout(() => {
    hideEl.classList.add("hidden");
    hideEl.classList.remove("leaving");

    showEl.classList.remove("hidden");
    showEl.classList.add("entering");

    void showEl.offsetWidth;

    showEl.classList.remove("entering");
    window.scrollTo({ top: 0, behavior: "auto" });

    setTimeout(() => {
      isAnimating = false;
      if (afterSwitch) afterSwitch();
    }, 400);
  }, 350);
}

function goHome(e) {
  if (e) e.preventDefault();
  const board = document.getElementById("boardPage");
  if (board.classList.contains("hidden")) return;
  switchPage("boardPage", "heroPage");
}

function goBoard(e) {
  if (e) e.preventDefault();
  const hero = document.getElementById("heroPage");
  if (hero.classList.contains("hidden")) {
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  switchPage("heroPage", "boardPage", renderBoard);
}

/* ============================================================
   ПОИСК
   ============================================================ */
const heroSearch = document.getElementById("heroSearch");
const heroResults = document.getElementById("heroSearchResults");

heroSearch.addEventListener("input", () => {
  const q = heroSearch.value.trim().toLowerCase();
  if (!q) { heroResults.classList.remove("open"); heroResults.innerHTML = ""; return; }

  const matches = PLAYERS.filter(p => p.name.toLowerCase().includes(q)).slice(0, 8);
  heroResults.innerHTML = "";

  if (!matches.length) {
    heroResults.innerHTML = `<div class="search-empty">Игрок не найден</div>`;
    heroResults.classList.add("open");
    return;
  }

  matches.forEach(p => {
    const item = document.createElement("div");
    item.className = "search-item";

    const img = document.createElement("img");
    img.alt = p.name;
    img.src = skinUrl(p, 64);
    img.onerror = function () { this.onerror = null; this.src = skinFallback(p); };

    const name = document.createElement("div");
    name.className = "search-item-name";
    name.textContent = p.name;

    const tierEl = document.createElement("div");
    if (p.retired) {
      tierEl.className = "search-item-tier retired";
      tierEl.textContent = "RETIRED";
    } else {
      tierEl.className = "search-item-tier";
      tierEl.textContent = p.tier;
    }

    item.appendChild(img);
    item.appendChild(name);
    item.appendChild(tierEl);

    item.addEventListener("click", () => {
      heroSearch.value = "";
      heroResults.classList.remove("open");
      goBoard();
      setTimeout(() => {
        const el = document.querySelector(`[data-player-name="${p.name}"]`);
        if (el) {
          el.scrollIntoView({ behavior: "smooth", block: "center" });
          el.classList.add("flash");
          setTimeout(() => el.classList.remove("flash"), 2000);
        }
      }, 900);
    });

    heroResults.appendChild(item);
  });

  heroResults.classList.add("open");
});

document.addEventListener("click", (e) => {
  if (!heroSearch.contains(e.target) && !heroResults.contains(e.target)) {
    heroResults.classList.remove("open");
  }
});

/* ============================================================
   РЕНДЕР
   ============================================================ */
function buildCard(p, rank) {
  const card = document.createElement("div");
  card.className = "rank-card";
  card.dataset.playerName = p.name;

  const badge = document.createElement("div");
  if (rank === 1) badge.className = "rank-badge rank-1";
  else if (rank === 2) badge.className = "rank-badge rank-2";
  else if (rank === 3) badge.className = "rank-badge rank-3";
  else badge.className = "rank-badge rank-other";
  badge.textContent = rank + ".";
  card.appendChild(badge);

  const main = document.createElement("div");
  main.className = "rank-main";

  const skin = document.createElement("div");
  skin.className = "rank-skin";
  const img = document.createElement("img");
  img.alt = p.name;
  img.loading = "lazy";
  img.src = skinUrl(p, 128);
  img.onerror = function () { this.onerror = null; this.src = skinFallback(p); };
  skin.appendChild(img);

  const info = document.createElement("div");
  info.className = "rank-info";

  const nameRow = document.createElement("div");
  nameRow.className = "rank-name-row";

  const name = document.createElement("div");
  name.className = "rank-name";
  name.textContent = p.name;
  nameRow.appendChild(name);

  if (p.retired) {
    const tag = document.createElement("div");
    tag.className = "retired-tag";
    tag.textContent = "RETIRED";
    nameRow.appendChild(tag);
  }

  const tierLine = document.createElement("div");
  tierLine.className = "rank-tier-line";
  const tBadge = document.createElement("div");
  tBadge.className = `rank-tier-badge ${tierClass(p.tier)}`;
  tBadge.textContent = p.tier;
  const tLabel = document.createElement("div");
  tLabel.className = "rank-tier-label";
  tLabel.textContent = "Sword · " + p.points + " " + plural(p.points, "очко", "очка", "очков");
  tierLine.appendChild(tBadge);
  tierLine.appendChild(tLabel);

  info.appendChild(nameRow);
  info.appendChild(tierLine);

  main.appendChild(skin);
  main.appendChild(info);
  card.appendChild(main);

  return card;
}

const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    if (entry.isIntersecting) {
      entry.target.classList.add("visible");
      revealObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.08, rootMargin: "0px 0px -40px 0px" });

function renderBoard() {
  const list = document.getElementById("boardList");
  list.innerHTML = "";

  const active = PLAYERS.filter(p => !p.retired).sort((a, b) => {
    const d = tierRank(a.tier) - tierRank(b.tier);
    return d !== 0 ? d : b.points - a.points;
  });

  const retired = PLAYERS.filter(p => p.retired).sort((a, b) => {
    const d = tierRank(a.tier) - tierRank(b.tier);
    return d !== 0 ? d : b.points - a.points;
  });

  const activeDivider = document.createElement("div");
  activeDivider.className = "section-divider";
  activeDivider.innerHTML = `<div class="line"></div><div class="label active-label">Активные</div><div class="line"></div>`;
  list.appendChild(activeDivider);

  active.forEach((p, i) => {
    const card = buildCard(p, i + 1);
    list.appendChild(card);
    revealObserver.observe(card);
  });

  if (retired.length) {
    const retiredDivider = document.createElement("div");
    retiredDivider.className = "section-divider";
    retiredDivider.innerHTML = `<div class="line"></div><div class="label">Retired · LT2+</div><div class="line"></div>`;
    list.appendChild(retiredDivider);

    retired.forEach((p, i) => {
      const card = buildCard(p, i + 1);
      list.appendChild(card);
      revealObserver.observe(card);
    });
  }
}
</script>
