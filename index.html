<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexTiers — Sword Tierlist</title>
<link rel="preconnect" href="https://mc-heads.net" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #07090d;
    color: #e6e8ee;
    line-height: 1.55;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(600px 400px at 15% 10%, rgba(255, 209, 102, 0.07), transparent 60%),
      radial-gradient(700px 500px at 85% 15%, rgba(124, 58, 237, 0.08), transparent 60%),
      radial-gradient(800px 500px at 50% 100%, rgba(0, 180, 216, 0.05), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }

  .navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10, 12, 16, 0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  }
  .navbar-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
    height: 66px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: 1.6px;
    text-transform: uppercase;
  }
  .logo-mark {
    width: 42px; height: 42px;
    border-radius: 50%;
    overflow: hidden;
    background: #0a0c10;
    box-shadow: 0 0 0 2px #0a0c10, 0 0 0 3px rgba(212, 160, 23, 0.5);
    flex-shrink: 0;
    transition: transform .3s ease;
  }
  .logo:hover .logo-mark { transform: scale(1.06); }
  .logo-mark img { width: 100%; height: 100%; object-fit: cover; }
  .nav-actions { display: flex; align-items: center; gap: 10px; }
  .nav-btn {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    display: grid; place-items: center;
    cursor: pointer;
    transition: background .2s ease, transform .2s ease, border-color .2s ease;
  }
  .nav-btn:hover {
    background: rgba(255, 255, 255, 0.08);
    transform: translateY(-2px);
    border-color: rgba(255, 255, 255, 0.12);
  }
  .nav-btn:active { transform: translateY(0) scale(0.96); }
  .nav-btn svg { stroke: #a0a8ba; }
  .nav-btn.discord-btn {
    background: linear-gradient(135deg, #5865F2, #4752c4);
    border-color: transparent;
  }
  .nav-btn.discord-btn:hover { background: linear-gradient(135deg, #6b78ff, #5865F2); }
  .nav-btn.discord-btn svg { stroke: none; fill: #fff; }

  .page {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    opacity: 1;
    transform: translateY(0);
    transition: opacity .3s ease, transform .3s ease;
  }
  .page.leaving { opacity: 0; transform: translateY(8px); pointer-events: none; }
  .page.entering { opacity: 0; transform: translateY(8px); }

  .hero {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px 60px;
    text-align: center;
  }
  .hero > * { position: relative; z-index: 1; }
  .hero-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #d4a017;
    margin-bottom: 26px;
  }
  .hero h1 {
    font-size: clamp(2.2rem, 7vw, 4rem);
    font-weight: 900;
    line-height: 1.02;
    letter-spacing: -2px;
    max-width: 700px;
    margin-bottom: 22px;
    background: linear-gradient(180deg, #ffffff 0%, #b8c0d0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero p {
    color: #8b94a7;
    font-size: 1.02rem;
    max-width: 560px;
    margin-bottom: 42px;
  }
  .cta-row {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 48px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 28px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 0.96rem;
    font-family: inherit;
    border: none;
    cursor: pointer;
    transition: transform .2s ease, filter .2s ease, box-shadow .2s ease, background .2s ease;
    text-decoration: none;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0) scale(0.98); }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary {
    background: linear-gradient(135deg, #ffd166 0%, #e6b800 100%);
    color: #1a1400;
    box-shadow: 0 8px 24px rgba(255, 209, 102, 0.22);
  }
  .btn-primary:hover {
    filter: brightness(1.08);
    box-shadow: 0 12px 30px rgba(255, 209, 102, 0.35);
  }
  .btn-secondary {
    background: rgba(255, 255, 255, 0.04);
    color: #e6e8ee;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.14);
  }

  .search-hero {
    width: 100%;
    max-width: 640px;
    position: relative;
  }
  .search-hero > svg {
    position: absolute;
    left: 18px; top: 50%;
    transform: translateY(-50%);
    width: 17px; height: 17px;
    stroke: #6d7688;
    pointer-events: none;
  }
  .search-hero input {
    width: 100%;
    padding: 16px 20px 16px 48px;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 16px;
    color: #e6e8ee;
    font-size: 0.96rem;
    font-family: inherit;
    outline: none;
    transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }
  .search-hero input:focus {
    border-color: rgba(255, 209, 102, 0.5);
    background: rgba(255, 255, 255, 0.05);
    box-shadow: 0 0 0 4px rgba(255, 209, 102, 0.08);
  }
  .search-hero input::placeholder { color: #5a6377; }

  .search-results {
    position: absolute;
    top: calc(100% + 10px);
    left: 0; right: 0;
    background: #12161f;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 16px;
    max-height: 340px;
    overflow-y: auto;
    z-index: 50;
    display: none;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity .2s ease, transform .2s ease;
  }
  .search-results.open { display: block; opacity: 1; transform: translateY(0); }
  .search-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 16px;
    cursor: pointer;
    transition: background .15s ease;
    text-align: left;
  }
  .search-item:hover { background: rgba(255, 255, 255, 0.05); }
  .search-item img {
    width: 36px; height: 36px;
    border-radius: 10px;
    image-rendering: pixelated;
    background: #1a1f2b;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  .search-item-name { font-weight: 600; font-size: 0.92rem; }
  .search-item-tier {
    margin-left: auto;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 7px;
    background: rgba(255, 209, 102, 0.12);
    color: #ffd166;
  }
  .search-item-tier.retired { background: rgba(255, 107, 107, 0.12); color: #ff6b6b; }
  .search-item-tier.none { background: rgba(109, 118, 136, 0.12); color: #98a1b3; }
  .search-empty { padding: 22px 16px; text-align: center; color: #6d7688; font-size: 0.88rem; }

  .board-wrap {
    flex: 1;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    padding: 30px 20px 100px;
  }
  .section-divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 42px 0 22px;
  }
  .section-divider:first-child { margin-top: 0; }
  .section-divider .line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.08) 50%, transparent 100%);
  }
  .section-divider .label {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: #ff6b6b;
    padding: 6px 14px;
    border-radius: 8px;
    background: rgba(255, 107, 107, 0.06);
    border: 1px solid rgba(255, 107, 107, 0.12);
  }
  .section-divider .label.active-label {
    color: #ffd166;
    background: rgba(255, 209, 102, 0.06);
    border-color: rgba(255, 209, 102, 0.14);
  }
  .section-divider .label.none-label {
    color: #98a1b3;
    background: rgba(152, 161, 179, 0.05);
    border-color: rgba(152, 161, 179, 0.12);
  }

  .player-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 14px;
  }
  @media (max-width: 820px) { .player-grid { grid-template-columns: 1fr; } }

  .player-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    background: #10141d;
    border: 1px solid rgba(255, 255, 255, 0.055);
    border-radius: 20px;
    cursor: pointer;
    overflow: hidden;
    opacity: 0;
    transform: translateY(14px);
    transition: border-color .25s ease, transform .25s ease, box-shadow .25s ease, background .25s ease;
  }
  .player-card.visible { opacity: 1; transform: translateY(0); }
  .player-card:hover {
    border-color: rgba(255, 255, 255, 0.12);
    background: #141924;
    transform: translateY(-3px);
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
  }
  .player-card.flash {
    border-color: rgba(255, 209, 102, 0.7) !important;
    box-shadow: 0 0 0 4px rgba(255, 209, 102, 0.15) !important;
  }
  .rank-num {
    position: absolute;
    top: 12px;
    left: 16px;
    font-size: 0.82rem;
    font-weight: 800;
    color: #4a5568;
    letter-spacing: 0.4px;
  }
  .rank-num.top-1 { color: #ffd166; }
  .rank-num.top-2 { color: #c8d0dc; }
  .rank-num.top-3 { color: #e0965a; }

  .skin-wrap {
    width: 64px; height: 64px;
    border-radius: 16px;
    background: #1a1f2b;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    flex-shrink: 0;
    margin-top: 6px;
    transition: transform .25s ease;
  }
  .player-card:hover .skin-wrap { transform: scale(1.06); }
  .skin-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .player-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 9px; }
  .player-name {
    font-size: 1.08rem;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-left: 44px;
    margin-top: 2px;
  }
  .player-name.no-rank { padding-left: 0; }

  .tier-badge {
    display: inline-flex;
    align-items: center;
    align-self: flex-start;
    position: relative;
    height: 34px;
  }
  .tier-circle {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
    box-shadow: 0 3px 8px rgba(0,0,0,0.35);
  }
  .tier-circle svg {
    width: 18px; height: 18px;
    stroke: #0a0c10;
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .tier-rect {
    margin-left: -10px;
    height: 28px;
    display: flex;
    align-items: center;
    padding: 0 16px 0 18px;
    font-size: 0.82rem;
    font-weight: 800;
    letter-spacing: 0.6px;
    border-radius: 0 9px 9px 0;
    color: #0a0c10;
    position: relative;
    z-index: 1;
  }

  .tier-HT1 .tier-circle { background: #ffd166; }
  .tier-HT1 .tier-rect   { background: #ffd166; }
  .tier-LT1 .tier-circle { background: #ffe08a; }
  .tier-LT1 .tier-rect   { background: #ffe08a; }
  .tier-HT2 .tier-circle { background: #d8dee9; }
  .tier-HT2 .tier-rect   { background: #d8dee9; }
  .tier-LT2 .tier-circle { background: #b9c2d0; }
  .tier-LT2 .tier-rect   { background: #b9c2d0; }
  .tier-HT3 .tier-circle { background: #e0965a; }
  .tier-HT3 .tier-rect   { background: #e0965a; }
  .tier-LT3 .tier-circle { background: #c58354; }
  .tier-LT3 .tier-rect   { background: #c58354; }
  .tier-HT4 .tier-circle { background: #5a6578; }
  .tier-HT4 .tier-rect   { background: #4a5568; color: #e6e8ee; }
  .tier-HT4 .tier-circle svg { stroke: #fff; }
  .tier-LT4 .tier-circle { background: #3a4250; }
  .tier-LT4 .tier-rect   { background: #333c4c; color: #c7cdda; }
  .tier-LT4 .tier-circle svg { stroke: #fff; }
  .tier-HT5 .tier-circle { background: #333c4c; }
  .tier-HT5 .tier-rect   { background: #2a3140; color: #a7b0c2; }
  .tier-HT5 .tier-circle svg { stroke: #fff; }
  .tier-LT5 .tier-circle { background: #262c38; }
  .tier-LT5 .tier-rect   { background: #1e2431; color: #8b94a7; }
  .tier-LT5 .tier-circle svg { stroke: #fff; }

  .tier-RHT1 .tier-circle, .tier-RHT1 .tier-rect { background: #b8992e; color: #1a1400; }
  .tier-RLT1 .tier-circle, .tier-RLT1 .tier-rect { background: #b8a05a; color: #1a1400; }
  .tier-RHT2 .tier-circle, .tier-RHT2 .tier-rect { background: #98a1b0; color: #14161a; }
  .tier-RLT2 .tier-circle, .tier-RLT2 .tier-rect { background: #8890a0; color: #14161a; }
  .tier-RHT1 .tier-circle svg, .tier-RLT1 .tier-circle svg,
  .tier-RHT2 .tier-circle svg, .tier-RLT2 .tier-circle svg { stroke: #0a0c10; }

  .no-tier-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    align-self: flex-start;
    padding: 6px 13px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    color: #5a6377;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4, 6, 9, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    width: 100%;
    max-width: 460px;
    background: #12161f;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 24px;
    padding: 26px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.7);
    transform: scale(0.96) translateY(8px);
    transition: transform .25s ease;
    position: relative;
    overflow: hidden;
  }
  .modal-overlay.open .modal { transform: scale(1) translateY(0); }
  .modal::before {
    content: "";
    position: absolute;
    top: -60%; left: -30%;
    width: 160%; height: 120%;
    background: radial-gradient(circle at 50% 0%, rgba(255, 209, 102, 0.08), transparent 45%);
    pointer-events: none;
  }
  .modal-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 36px; height: 36px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    display: grid; place-items: center;
    cursor: pointer;
    transition: background .2s ease, transform .25s ease;
    z-index: 2;
  }
  .modal-close:hover { background: rgba(255, 255, 255, 0.08); transform: rotate(90deg); }
  .modal-close svg { stroke: #98a1b3; width: 14px; height: 14px; }

  .modal-header { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; position: relative; z-index: 1; }
  .modal-skin {
    width: 76px; height: 76px;
    border-radius: 18px;
    overflow: hidden;
    background: #1a1f2b;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    flex-shrink: 0;
  }
  .modal-skin img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
  .modal-name { font-size: 1.4rem; font-weight: 900; letter-spacing: -0.5px; color: #fff; line-height: 1.2; }
  .modal-discord { color: #6d7688; font-size: 0.86rem; margin-top: 4px; }

  .modal-tier {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding: 16px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 16px;
    position: relative;
    z-index: 1;
  }
  .modal-tier-label {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #5a6377;
    margin-bottom: 7px;
  }
  .modal-tier-main { flex: 1; }

  .modal-points {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    background: rgba(255, 209, 102, 0.05);
    border: 1px solid rgba(255, 209, 102, 0.16);
    border-radius: 16px;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }
  .modal-points-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #8b94a7; }
  .modal-points-value { font-size: 1.6rem; font-weight: 900; color: #ffd166; letter-spacing: -0.5px; }
  .modal-points-value small { font-size: 0.75rem; color: #8b94a7; font-weight: 600; margin-left: 4px; }

  .modal-status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 18px;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    position: relative;
    z-index: 1;
  }
  .modal-status-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #5a6377; }
  .modal-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 13px;
    border-radius: 10px;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .status-active { background: rgba(34, 197, 94, 0.12); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.25); }
  .status-retired { background: rgba(255, 107, 107, 0.1); color: #ff6b6b; border: 1px solid rgba(255, 107, 107, 0.25); }
  .status-none { background: rgba(109, 118, 136, 0.12); color: #98a1b3; border: 1px solid rgba(109, 118, 136, 0.25); }

  .state-box { text-align: center; padding: 80px 20px; color: #6d7688; }
  .state-box h3 { color: #98a1b3; font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; }
  .state-box p { font-size: 0.9rem; }

  .hidden { display: none !important; }

  @media (max-width: 600px) {
    .navbar-inner { padding: 0 14px; height: 60px; }
    .logo { font-size: 0.95rem; letter-spacing: 1px; }
    .logo-mark { width: 38px; height: 38px; }
    .hero { padding: 50px 16px 40px; }
    .board-wrap { padding: 20px 14px 80px; }
    .btn { padding: 13px 22px; font-size: 0.9rem; }
    .player-card { padding: 15px; gap: 13px; }
    .skin-wrap { width: 54px; height: 54px; }
    .player-name { font-size: 1rem; padding-left: 0; }
    .modal { padding: 20px; }
    .modal-skin { width: 62px; height: 62px; }
    .modal-name { font-size: 1.18rem; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="#" class="logo" onclick="goHome(event)">
      <div class="logo-mark">
        <img src="logo.png" alt="NexTiers" />
      </div>
      <span>Nextiers</span>
    </a>
    <div class="nav-actions">
      <a href="#" class="nav-btn" onclick="goHome(event)" title="Поиск">

      <a class="nav-btn discord-btn" href="https://discord.gg/uvd9PgCmMX" target="_blank" rel="noopener" title="Discord">

<section class="page" id="heroPage">
  <div class="hero">
    <div class="hero-label">Nextiers</div>
    <h1>Sword Tierlist<br/>игроков Minecraft</h1>
    <p>Соревнуйтесь с другими игроками, проходите тесты, получайте престижные тиры и докажите своё абсолютное превосходство.</p>

    <div class="cta-row">
      <button class="btn btn-primary" onclick="goBoard()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>

      </button>
      <a class="btn btn-secondary" href="https://discord.gg/uvd9PgCmMX" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" style="stroke:none"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.418 2.157-2.418 1.21 0 2.176 1.096 2.157 2.418 0 1.334-.956 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.096 2.157 2.418 0 1.334-.946 2.419-2.157 2.419z"/></svg>

    <div class="search-hero">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="heroSearch" placeholder="Поиск игрока..." autocomplete="off" />
      <div class="search-results" id="heroSearchResults"></div>

</section>

<section class="page hidden" id="boardPage">
  <div class="board-wrap">
    <div id="boardList"></div>
  </div>
</section>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>

<script>
/* ============================================================
   КОНФИГ
   ============================================================ */
const DATA_URL = 'players.json';
const AUTO_REFRESH_MS = 60 * 1000;

const TIER_POINTS = {
  HT1: 60, LT1: 45, HT2: 30, LT2: 20,
  HT3: 10, LT3: 6, HT4: 4, LT4: 3, HT5: 2, LT5: 1
};
const TIER_ORDER = ["HT1","LT1","HT2","LT2","HT3","LT3","HT4","LT4","HT5","LT5"];
const RETIRED_TIERS = ["RHT1","RLT1","RHT2","RLT2"];

let PLAYERS = [];
let loadedOnce = false;

/* ============================================================
   ХЕЛПЕРЫ
   ============================================================ */
function skinUrl(p, size) {
  const key = (p.uuid && p.uuid.trim()) ? p.uuid.trim() : p.name;
  return `https://mc-heads.net/avatar/${encodeURIComponent(key)}/${size}`;
}
function skinFallback(p) {
  return `https://mc-heads.net/avatar/${encodeURIComponent(p.name)}/128`;
}
function tierClass(t) { return "tier-" + String(t).toUpperCase(); }
function isRetired(t) { return t && t.startsWith("R"); }
function normalTierFromRetired(rt) {
  if (rt && rt.startsWith("R") && rt.length >= 4) return rt.substring(1);
  return null;
}
function tierRank(t) {
  if (!t) return 999;
  if (t.startsWith("R")) {
    const i = RETIRED_TIERS.indexOf(t);
    return 200 + (i === -1 ? 99 : i);
  }
  const i = TIER_ORDER.indexOf(t);
  return i === -1 ? 999 : i;
}
function pointsForTier(t) {
  if (!t) return 0;
  const normal = t.startsWith("R") ? normalTierFromRetired(t) : t;
  return TIER_POINTS[normal] || 0;
}

/* ============================================================
   ПЕРЕХОД МЕЖДУ СТРАНИЦАМИ
   ============================================================ */
let isAnimating = false;
function switchPage(hideId, showId, afterSwitch) {
  if (isAnimating) return;
  isAnimating = true;
  const hideEl = document.getElementById(hideId);
  const showEl = document.getElementById(showId);
  hideEl.classList.add("leaving");
  setTimeout(() => {
    hideEl.classList.add("hidden");
    hideEl.classList.remove("leaving");
    showEl.classList.remove("hidden");
    showEl.classList.add("entering");
    void showEl.offsetWidth;
    showEl.classList.remove("entering");
    window.scrollTo({ top: 0, behavior: "auto" });
    setTimeout(() => {
      isAnimating = false;
      if (afterSwitch) afterSwitch();
    }, 350);
  }, 300);
}
function goHome(e) {
  if (e) e.preventDefault();
  const board = document.getElementById("boardPage");
  if (board.classList.contains("hidden")) return;
  switchPage("boardPage", "heroPage");
}
function goBoard(e) {
  if (e) e.preventDefault();
  const hero = document.getElementById("heroPage");
  if (hero.classList.contains("hidden")) {
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  switchPage("heroPage", "boardPage", renderBoard);
}

/* ============================================================
   ЗАГРУЗКА players.json
   ============================================================ */
async function loadPlayers() {
  const boardList = document.getElementById("boardList");
  try {
    const resp = await fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    if (!Array.isArray(data)) throw new Error("Не массив");

    const newStr = JSON.stringify(data);
    const oldStr = JSON.stringify(PLAYERS);
    PLAYERS = data;
    loadedOnce = true;

    const board = document.getElementById("boardPage");
    if (!board.classList.contains("hidden") && newStr !== oldStr) {
      renderBoard();
    }
  } catch (e) {
    console.warn("Не удалось загрузить players.json:", e);
    if (!loadedOnce && boardList) {
      boardList.innerHTML = `
        <div class="state-box">
          <h3>Не удалось загрузить данные</h3>
          <p>Бот ещё не создал <code>players.json</code>. Попробуй позже.</p>
        </div>`;
    }
  }
}

/* ============================================================
   ТИР-БЕЙДЖ
   ============================================================ */
const SWORD_SVG = `<svg viewBox="0 0 24 24"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/></svg>`;

function makeTierBadge(tier) {
  if (!tier) {
    const b = document.createElement("div");
    b.className = "no-tier-badge";
    b.textContent = "Без тира";
    return b;
  }
  const wrap = document.createElement("div");
  wrap.className = "tier-badge " + tierClass(tier);
  const circle = document.createElement("div");
  circle.className = "tier-circle";
  circle.innerHTML = SWORD_SVG;
  const rect = document.createElement("div");
  rect.className = "tier-rect";
  rect.textContent = tier;
  wrap.appendChild(circle);
  wrap.appendChild(rect);
  return wrap;
}

/* ============================================================
   КАРТОЧКА ИГРОКА
   ============================================================ */
function buildCard(p, rank) {
  const card = document.createElement("div");
  card.className = "player-card";
  card.dataset.playerName = p.name;

  if (rank && rank > 0) {
    const rk = document.createElement("div");
    rk.className = "rank-num" + (rank === 1 ? " top-1" : rank === 2 ? " top-2" : rank === 3 ? " top-3" : "");
    rk.textContent = rank + ".";
    card.appendChild(rk);
  }

  const skin = document.createElement("div");
  skin.className = "skin-wrap";
  const img = document.createElement("img");
  img.alt = p.name;
  img.loading = "lazy";
  img.decoding = "async";
  img.src = skinUrl(p, 128);
  img.onerror = function () { this.onerror = null; this.src = skinFallback(p); };
  skin.appendChild(img);

  const info = document.createElement("div");
  info.className = "player-info";

  const name = document.createElement("div");
  name.className = "player-name" + (rank && rank > 0 ? "" : " no-rank");
  name.textContent = p.name;

  info.appendChild(name);
  info.appendChild(makeTierBadge(p.tier));

  card.appendChild(skin);
  card.appendChild(info);
  card.addEventListener("click", () => openModal(p));
  return card;
}

/* ============================================================
   РЕНДЕР
   ============================================================ */
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    if (entry.isIntersecting) {
      entry.target.classList.add("visible");
      revealObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.05, rootMargin: "0px 0px -40px 0px" });

function makeDivider(labelText, cls) {
  const d = document.createElement("div");
  d.className = "section-divider";
  d.innerHTML = `<div class="line"></div><div class="label ${cls || ""}">${labelText}</div><div class="line"></div>`;
  return d;
}

function renderBoard() {
  const list = document.getElementById("boardList");
  if (!list) return;
  list.innerHTML = "";

  // Активные — есть обычный тир (без R)
  const active = PLAYERS
    .filter(p => p.tier && !isRetired(p.tier))
    .sort((a, b) => {
      const d = tierRank(a.tier) - tierRank(b.tier);
      return d !== 0 ? d : (b.points || 0) - (a.points || 0);
    });

  // Retired — тир начинается с R и входит в 4 разрешённых
  const retired = PLAYERS
    .filter(p => isRetired(p.tier) && RETIRED_TIERS.includes(p.tier))
    .sort((a, b) => {
      const d = tierRank(a.tier) - tierRank(b.tier);
      return d !== 0 ? d : (b.points || 0) - (a.points || 0);
    });

  // Без тира — нет тира и не retired
  const noTier = PLAYERS
    .filter(p => !p.tier)
    .sort((a, b) => a.name.localeCompare(b.name));

  if (active.length) {
    list.appendChild(makeDivider("Активные", "active-label"));
    const grid = document.createElement("div");
    grid.className = "player-grid";
    active.forEach((p, i) => {
      const c = buildCard(p, i + 1);
      grid.appendChild(c);
      revealObserver.observe(c);
    });
    list.appendChild(grid);
  }

  if (noTier.length) {
    list.appendChild(makeDivider("Без тира", "none-label"));
    const grid = document.createElement("div");
    grid.className = "player-grid";
    noTier.forEach(p => {
      const c = buildCard(p, 0);
      grid.appendChild(c);
      revealObserver.observe(c);
    });
    list.appendChild(grid);
  }

  if (retired.length) {
    list.appendChild(makeDivider("Retired", ""));
    const grid = document.createElement("div");
    grid.className = "player-grid";
    retired.forEach((p, i) => {
      const c = buildCard(p, i + 1);
      grid.appendChild(c);
      revealObserver.observe(c);
    });
    list.appendChild(grid);
  }

  if (!active.length && !noTier.length && !retired.length) {
    list.innerHTML = `
      <div class="state-box">
        <h3>Данных пока нет</h3>
        <p>Бот ещё не синхронизировал игроков. Обнови страницу позже.</p>
      </div>`;
  }
}

/* ============================================================
   МОДАЛКА
   ============================================================ */
const modalOverlay = document.getElementById("modalOverlay");
const modalBox = document.getElementById("modalBox");

function openModal(p) {
  const pts = p.points || pointsForTier(p.tier);
  const isRet = isRetired(p.tier);
  const statusLabel = isRet ? "Retired" : (p.tier ? "Активный" : "Без тира");
  const statusClass = isRet ? "status-retired" : (p.tier ? "status-active" : "status-none");

  modalBox.innerHTML = "";

  const close = document.createElement("button");
  close.className = "modal-close";
  close.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
  close.onclick = closeModal;
  modalBox.appendChild(close);

  const header = document.createElement("div");
  header.className = "modal-header";
  const mskin = document.createElement("div");
  mskin.className = "modal-skin";
  const mimg = document.createElement("img");
  mimg.alt = p.name;
  mimg.src = skinUrl(p, 160);
  mimg.onerror = function () { this.onerror = null; this.src = skinFallback(p); };
  mskin.appendChild(mimg);

  const hinfo = document.createElement("div");
  const hname = document.createElement("div");
  hname.className = "modal-name";
  hname.textContent = p.name;
  const hdisc = document.createElement("div");
  hdisc.className = "modal-discord";
  hdisc.textContent = "@" + (p.discord || p.name);
  hinfo.appendChild(hname);
  hinfo.appendChild(hdisc);

  header.appendChild(mskin);
  header.appendChild(hinfo);
  modalBox.appendChild(header);

  const tierBlock = document.createElement("div");
  tierBlock.className = "modal-tier";
  const tierMain = document.createElement("div");
  tierMain.className = "modal-tier-main";
  const tierLabel = document.createElement("div");
  tierLabel.className = "modal-tier-label";
  tierLabel.textContent = "Тир · Sword";
  tierMain.appendChild(tierLabel);
  tierMain.appendChild(makeTierBadge(p.tier));
  tierBlock.appendChild(tierMain);
  modalBox.appendChild(tierBlock);

  const pointsBlock = document.createElement("div");
  pointsBlock.className = "modal-points";
  pointsBlock.innerHTML = `
    <div class="modal-points-label">Поинты</div>
    <div class="modal-points-value">${pts}<small>pts</small></div>
  `;
  modalBox.appendChild(pointsBlock);

  const statusBlock = document.createElement("div");
  statusBlock.className = "modal-status";
  statusBlock.innerHTML = `
    <div class="modal-status-label">Статус</div>
    <div class="modal-status-badge ${statusClass}">${statusLabel}</div>
  `;
  modalBox.appendChild(statusBlock);

  modalOverlay.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  modalOverlay.classList.remove("open");
  document.body.style.overflow = "";
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
});

/* ============================================================
   ПОИСК
   ============================================================ */
const heroSearch = document.getElementById("heroSearch");
const heroResults = document.getElementById("heroSearchResults");

heroSearch.addEventListener("input", () => {
  const q = heroSearch.value.trim().toLowerCase();
  if (!q) { heroResults.classList.remove("open"); heroResults.innerHTML = ""; return; }

  const matches = PLAYERS.filter(p =>
    p.name.toLowerCase().includes(q) || (p.discord && p.discord.toLowerCase().includes(q))
  ).slice(0, 8);

  heroResults.innerHTML = "";

  if (!matches.length) {
    heroResults.innerHTML = `<div class="search-empty">Игрок не найден</div>`;
    heroResults.classList.add("open");
    return;
  }

  matches.forEach(p => {
    const item = document.createElement("div");
    item.className = "search-item";

    const img = document.createElement("img");
    img.alt = p.name;
    img.src = skinUrl(p, 64);
    img.onerror = function () { this.onerror = null; this.src = skinFallback(p); };

    const name = document.createElement("div");
    name.className = "search-item-name";
    name.textContent = p.name;

    const tierEl = document.createElement("div");
    if (isRetired(p.tier)) {
      tierEl.className = "search-item-tier retired";
      tierEl.textContent = p.tier;
    } else if (!p.tier) {
      tierEl.className = "search-item-tier none";
      tierEl.textContent = "БЕЗ ТИРА";
    } else {
      tierEl.className = "search-item-tier";
      tierEl.textContent = p.tier;
    }

    item.appendChild(img);
    item.appendChild(name);
    item.appendChild(tierEl);

    item.addEventListener("click", () => {
      heroSearch.value = "";
      heroResults.classList.remove("open");
      goBoard();
      setTimeout(() => {
        const el = document.querySelector(`[data-player-name="${p.name}"]`);
        if (el) {
          el.scrollIntoView({ behavior: "smooth", block: "center" });
          el.classList.add("flash");
          setTimeout(() => el.classList.remove("flash"), 2000);
        }
      }, 800);
    });

    heroResults.appendChild(item);
  });

  heroResults.classList.add("open");
});

document.addEventListener("click", (e) => {
  if (!heroSearch.contains(e.target) && !heroResults.contains(e.target)) {
    heroResults.classList.remove("open");
  }
});

/* ============================================================
   СТАРТ
   ============================================================ */
(async function init() {
  await loadPlayers();
  renderBoard();
  setInterval(loadPlayers, AUTO_REFRESH_MS);
})();
</script>
</body>
