<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexTiers — Sword Tierlist</title>
<link rel="preconnect" href="https://mc-heads.net" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0c10;
    color: #e6e8ee;
    line-height: 1.55;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }

  /* ===== NAVBAR ===== */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10, 12, 16, 0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid #161a22;
  }
  .navbar-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 20px;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .logo-mark {
    width: 42px; height: 42px;
    border-radius: 50%;
    overflow: hidden;
    background: #0a0c10;
    box-shadow: 0 0 0 2px #0a0c10, 0 0 0 3px #2a2416;
    flex-shrink: 0;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .logo:hover .logo-mark {
    transform: scale(1.06);
    box-shadow: 0 0 0 2px #0a0c10, 0 0 0 3px #d4a017, 0 0 20px rgba(255, 209, 102, 0.35);
  }
  .logo-mark img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }
  .nav-actions { display: flex; align-items: center; gap: 10px; }
  .nav-btn {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: #12161f;
    border: 1px solid #1c2029;
    display: grid; place-items: center;
    cursor: pointer;
    transition: background .2s ease, transform .2s ease, border-color .2s ease;
  }
  .nav-btn:hover {
    background: #1a1f2b;
    transform: translateY(-1px);
    border-color: #2a3140;
  }
  .nav-btn:active { transform: translateY(0) scale(0.96); }
  .nav-btn svg { stroke: #a0a8ba; transition: stroke .2s ease; }
  .nav-btn.discord-btn {
    background: #5865F2;
    border-color: #5865F2;
  }
  .nav-btn.discord-btn:hover {
    background: #4752c4;
    border-color: #4752c4;
    box-shadow: 0 6px 18px rgba(88, 101, 242, 0.35);
  }
  .nav-btn.discord-btn svg { stroke: none; fill: #fff; }

  /* ===== PAGES ===== */
  .page {
    flex: 1;
    display: flex;
    flex-direction: column;
    opacity: 1;
    transform: translateY(0);
    transition: opacity .35s ease, transform .35s ease;
  }
  .page.leaving {
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
  }
  .page.entering {
    opacity: 0;
    transform: translateY(8px);
  }

  /* ===== HERO ===== */
  .hero {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px 40px;
    text-align: center;
    overflow: hidden;
  }
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(700px 400px at 50% 0%, rgba(255, 209, 102, 0.05), transparent 60%),
      radial-gradient(600px 400px at 50% 100%, rgba(0, 180, 216, 0.04), transparent 60%);
    pointer-events: none;
  }
  .hero > * { position: relative; z-index: 1; }

  .hero-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #d4a017;
    margin-bottom: 22px;
    opacity: 0;
    animation: fadeUp .6s ease .1s forwards;
  }
  .hero h1 {
    font-size: clamp(2rem, 7vw, 3.6rem);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -1.5px;
    max-width: 620px;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp .6s ease .2s forwards;
  }
  .hero p {
    color: #8b94a7;
    font-size: 1rem;
    max-width: 560px;
    margin-bottom: 38px;
    opacity: 0;
    animation: fadeUp .6s ease .3s forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .cta-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 44px;
    opacity: 0;
    animation: fadeUp .6s ease .4s forwards;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 14px 26px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.96rem;
    font-family: inherit;
    border: none;
    cursor: pointer;
    transition: transform .18s ease, filter .18s ease, background .18s ease, box-shadow .18s ease;
    text-decoration: none;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0) scale(0.97); }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary {
    background: linear-gradient(135deg, #ffd166, #e6b800);
    color: #1a1400;
    box-shadow: 0 8px 24px rgba(255, 209, 102, 0.22);
  }
  .btn-primary:hover {
    filter: brightness(1.08);
    box-shadow: 0 12px 30px rgba(255, 209, 102, 0.35);
  }
  .btn-secondary {
    background: #161a22;
    color: #e6e8ee;
    border: 1px solid #232a37;
  }
  .btn-secondary:hover {
    background: #1c2230;
    border-color: #2a3140;
  }

  /* ===== SEARCH ===== */
  .search-hero {
    width: 100%;
    max-width: 620px;
    position: relative;
    opacity: 0;
    animation: fadeUp .6s ease .5s forwards;
  }
  .search-hero > svg {
    position: absolute;
    left: 16px; top: 50%;
    transform: translateY(-50%);
    width: 17px; height: 17px;
    stroke: #6d7688;
    pointer-events: none;
  }
  .search-hero input {
    width: 100%;
    padding: 15px 18px 15px 46px;
    background: #12161f;
    border: 1px solid #1e2431;
    border-radius: 13px;
    color: #e6e8ee;
    font-size: 0.96rem;
    font-family: inherit;
    outline: none;
    transition: border-color .25s ease, box-shadow .25s ease;
  }
  .search-hero input:focus {
    border-color: #d4a017;
    box-shadow: 0 0 0 4px rgba(255, 209, 102, 0.08);
  }
  .search-hero input::placeholder { color: #5a6377; }

  .search-results {
    position: absolute;
    top: calc(100% + 8px);
    left: 0; right: 0;
    background: #12161f;
    border: 1px solid #1e2431;
    border-radius: 13px;
    max-height: 320px;
    overflow-y: auto;
    z-index: 50;
    display: none;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity .2s ease, transform .2s ease;
  }
  .search-results.open {
    display: block;
    opacity: 1;
    transform: translateY(0);
  }
  .search-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    cursor: pointer;
    transition: background .15s ease;
    text-align: left;
    opacity: 0;
    animation: fadeUp .3s ease forwards;
  }
  .search-item:nth-child(1) { animation-delay: .02s; }
  .search-item:nth-child(2) { animation-delay: .05s; }
  .search-item:nth-child(3) { animation-delay: .08s; }
  .search-item:nth-child(4) { animation-delay: .11s; }
  .search-item:nth-child(5) { animation-delay: .14s; }
  .search-item:nth-child(6) { animation-delay: .17s; }
  .search-item:nth-child(7) { animation-delay: .20s; }
  .search-item:nth-child(8) { animation-delay: .23s; }
  .search-item:hover { background: #1a1f2b; }
  .search-item img {
    width: 34px; height: 34px;
    border-radius: 8px;
    image-rendering: pixelated;
    background: #1a1f2b;
    box-shadow: inset 0 0 0 1px #262c38;
  }
  .search-item-name { font-weight: 600; font-size: 0.92rem; }
  .search-item-tier {
    margin-left: auto;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(255, 209, 102, 0.12);
    color: #ffd166;
  }
  .search-item-tier.retired {
    background: rgba(255, 107, 107, 0.12);
    color: #ff6b6b;
  }
  .search-item-tier.none {
    background: rgba(109, 118, 136, 0.12);
    color: #98a1b3;
  }
  .search-empty {
    padding: 20px 16px;
    text-align: center;
    color: #6d7688;
    font-size: 0.88rem;
  }

  /* ===== BOARD ===== */
  .board-wrap {
    flex: 1;
    max-width: 1180px;
    width: 100%;
    margin: 0 auto;
    padding: 26px 20px 80px;
  }

  /* Заголовок секции */
  .section-divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 34px 0 18px;
    opacity: 0;
    animation: fadeUp .5s ease forwards;
  }
  .section-divider:first-child { margin-top: 0; }
  .section-divider .line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, #1c2029 50%, transparent 100%);
  }
  .section-divider .label {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #ff6b6b;
  }
  .section-divider .label.active-label { color: #ffd166; }
  .section-divider .label.none-label { color: #98a1b3; }

  /* Сетка игроков */
  .player-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 12px;
  }
  @media (max-width: 820px) {
    .player-grid { grid-template-columns: 1fr; }
  }

  /* Карточка игрока */
  .player-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 18px;
    background: linear-gradient(180deg, #10141d 0%, #0d1017 100%);
    border: 1px solid #1a1f2b;
    border-radius: 16px;
    cursor: pointer;
    overflow: hidden;
    opacity: 0;
    transform: translateY(14px);
    transition: border-color .25s ease, transform .25s ease, box-shadow .25s ease, background .25s ease;
    will-change: opacity, transform;
  }
  .player-card.visible {
    opacity: 1;
    transform: translateY(0);
    transition: opacity .5s ease, transform .5s ease, border-color .25s ease, box-shadow .25s ease, background .25s ease;
  }
  .player-card:hover {
    border-color: #2a3140;
    background: linear-gradient(180deg, #141924 0%, #0f131c 100%);
    transform: translateY(-2px);
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.4);
  }
  .player-card.flash {
    border-color: #ffd166 !important;
    box-shadow: 0 0 0 3px rgba(255, 209, 102, 0.2);
  }

  /* Место */
  .rank-num {
    position: absolute;
    top: 10px;
    left: 14px;
    font-size: 0.82rem;
    font-weight: 800;
    color: #4a5568;
    letter-spacing: 0.4px;
  }
  .rank-num.top-1 { color: #ffd166; }
  .rank-num.top-2 { color: #c8d0dc; }
  .rank-num.top-3 { color: #e0965a; }

  /* Скин */
  .skin-wrap {
    width: 62px; height: 62px;
    border-radius: 14px;
    background: #1a1f2b;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px #262c38, 0 4px 12px rgba(0,0,0,0.3);
    flex-shrink: 0;
    margin-top: 6px;
    transition: transform .25s ease;
  }
  .player-card:hover .skin-wrap { transform: scale(1.05); }
  .skin-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* Инфа об игроке */
  .player-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .player-name {
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-left: 42px;
    margin-top: 2px;
  }
  .player-name.no-rank { padding-left: 0; }

  /* Тир-бейдж: круг + прямоугольник */
  .tier-badge {
    display: inline-flex;
    align-items: center;
    gap: 0;
    align-self: flex-start;
    position: relative;
    height: 32px;
  }
  .tier-circle {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .tier-circle svg {
    width: 18px; height: 18px;
    stroke: #0a0c10;
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .tier-rect {
    margin-left: -8px;
    height: 26px;
    display: flex;
    align-items: center;
    padding: 0 14px 0 16px;
    font-size: 0.8rem;
    font-weight: 800;
    letter-spacing: 0.6px;
    border-radius: 0 8px 8px 0;
    color: #0a0c10;
    position: relative;
    z-index: 1;
  }

  /* Цвета тиров */
  .tier-HT1 .tier-circle { background: #ffd166; }
  .tier-HT1 .tier-rect   { background: #ffd166; }
  .tier-LT1 .tier-circle { background: #ffe08a; }
  .tier-LT1 .tier-rect   { background: #ffe08a; }
  .tier-HT2 .tier-circle { background: #d8dee9; }
  .tier-HT2 .tier-rect   { background: #d8dee9; }
  .tier-LT2 .tier-circle { background: #b9c2d0; }
  .tier-LT2 .tier-rect   { background: #b9c2d0; }
  .tier-HT3 .tier-circle { background: #e0965a; }
  .tier-HT3 .tier-rect   { background: #e0965a; }
  .tier-LT3 .tier-circle { background: #c58354; }
  .tier-LT3 .tier-rect   { background: #c58354; }
  .tier-HT4 .tier-circle { background: #5a6578; }
  .tier-HT4 .tier-rect   { background: #4a5568; color: #e6e8ee; }
  .tier-HT4 .tier-circle svg { stroke: #fff; }
  .tier-LT4 .tier-circle { background: #3a4250; }
  .tier-LT4 .tier-rect   { background: #333c4c; color: #c7cdda; }
  .tier-LT4 .tier-circle svg { stroke: #fff; }
  .tier-HT5 .tier-circle { background: #333c4c; }
  .tier-HT5 .tier-rect   { background: #2a3140; color: #a7b0c2; }
  .tier-HT5 .tier-circle svg { stroke: #fff; }
  .tier-LT5 .tier-circle { background: #262c38; }
  .tier-LT5 .tier-rect   { background: #1e2431; color: #8b94a7; }
  .tier-LT5 .tier-circle svg { stroke: #fff; }

  /* Retired цвета — чуть приглушённые */
  .tier-RHT1 .tier-circle, .tier-RHT1 .tier-rect { background: #b8992e; }
  .tier-RLT1 .tier-circle, .tier-RLT1 .tier-rect { background: #b8a05a; }
  .tier-RHT2 .tier-circle, .tier-RHT2 .tier-rect { background: #98a1b0; }
  .tier-RLT2 .tier-circle, .tier-RLT2 .tier-rect { background: #8890a0; }
  .tier-RHT3 .tier-circle, .tier-RHT3 .tier-rect { background: #a06a3a; }
  .tier-RLT3 .tier-circle, .tier-RLT3 .tier-rect { background: #8a5a35; }
  .tier-RHT4 .tier-circle, .tier-RHT4 .tier-rect { background: #3a4454; }
  .tier-RLT4 .tier-circle, .tier-RLT4 .tier-rect { background: #2a3140; }
  .tier-RHT5 .tier-circle, .tier-RHT5 .tier-rect { background: #262c38; }
  .tier-RLT5 .tier-circle, .tier-RLT5 .tier-rect { background: #1e2431; }
  .tier-RHT1 .tier-rect, .tier-RLT1 .tier-rect,
  .tier-RHT2 .tier-rect, .tier-RLT2 .tier-rect,
  .tier-RHT3 .tier-rect, .tier-RLT3 .tier-rect { color: #0a0c10; }
  .tier-RHT4 .tier-rect, .tier-RLT4 .tier-rect,
  .tier-RHT5 .tier-rect, .tier-RLT5 .tier-rect { color: #c7cdda; }
  .tier-RHT1 .tier-circle svg, .tier-RLT1 .tier-circle svg,
  .tier-RHT2 .tier-circle svg, .tier-RLT2 .tier-circle svg,
  .tier-RHT3 .tier-circle svg, .tier-RLT3 .tier-circle svg { stroke: #0a0c10; }
  .tier-RHT4 .tier-circle svg, .tier-RLT4 .tier-circle svg,
  .tier-RHT5 .tier-circle svg, .tier-RLT5 .tier-circle svg { stroke: #a7b0c2; }

  /* Бейдж "Без тира" */
  .no-tier-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    align-self: flex-start;
    padding: 5px 12px;
    border-radius: 8px;
    background: #161a22;
    border: 1px solid #1e2431;
    color: #5a6377;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .modal {
    width: 100%;
    max-width: 440px;
    background: linear-gradient(180deg, #131722 0%, #0d1017 100%);
    border: 1px solid #1f2532;
    border-radius: 20px;
    padding: 22px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6);
    transform: scale(0.96) translateY(10px);
    transition: transform .3s cubic-bezier(.2,.9,.3,1.2);
    position: relative;
    overflow: hidden;
  }
  .modal-overlay.open .modal {
    transform: scale(1) translateY(0);
  }
  .modal::before {
    content: "";
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 50% 0%, rgba(255, 209, 102, 0.08), transparent 40%);
    pointer-events: none;
  }
  .modal-close {
    position: absolute;
    top: 14px; right: 14px;
    width: 34px; height: 34px;
    border-radius: 10px;
    background: #161a22;
    border: 1px solid #1e2431;
    display: grid; place-items: center;
    cursor: pointer;
    transition: background .18s ease;
    z-index: 2;
  }
  .modal-close:hover { background: #1f2532; }
  .modal-close svg { stroke: #98a1b3; width: 14px; height: 14px; }

  .modal-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
    position: relative;
    z-index: 1;
  }
  .modal-skin {
    width: 72px; height: 72px;
    border-radius: 16px;
    overflow: hidden;
    background: #1a1f2b;
    box-shadow: inset 0 0 0 1px #262c38, 0 6px 16px rgba(0,0,0,0.4);
    flex-shrink: 0;
  }
  .modal-skin img {
    width: 100%; height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
  }
  .modal-name {
    font-size: 1.35rem;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: #fff;
    line-height: 1.2;
  }
  .modal-discord {
    color: #6d7688;
    font-size: 0.85rem;
    margin-top: 4px;
  }

  .modal-tier {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    padding: 14px;
    background: #0f131b;
    border: 1px solid #1a1f2b;
    border-radius: 14px;
    position: relative;
    z-index: 1;
  }
  .modal-tier-label {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #5a6377;
    margin-bottom: 6px;
  }
  .modal-tier-main { flex: 1; }

  .modal-points {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px;
    background: linear-gradient(90deg, rgba(255,209,102,0.06) 0%, rgba(255,209,102,0.01) 100%);
    border: 1px solid rgba(255,209,102,0.15);
    border-radius: 14px;
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
  }
  .modal-points-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 2px;

  }
</style>
</head>

<!-- Модалка -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>

<script>
/* ============================================================
   КОНФИГ
   ============================================================ */
const DATA_URL = 'players.json';
const AUTO_REFRESH_MS = 60 * 1000;

/* Поинты по тирам */
const TIER_POINTS = {
  HT1: 60, LT1: 45, HT2: 30, LT2: 20,
  HT3: 10, LT3: 6, HT4: 4, LT4: 3, HT5: 2, LT5: 1
};

/* Иерархия для сортировки */
const TIER_ORDER = ["HT1","LT1","HT2","LT2","HT3","LT3","HT4","LT4","HT5","LT5"];
const RETIRED_ORDER = ["RHT1","RLT1","RHT2","RLT2","RHT3","RLT3","RHT4","RLT4","RHT5","RLT5"];

/* ============================================================
   ДАННЫЕ
   ============================================================ */
let PLAYERS = [];
let loadedOnce = false;

/* ============================================================
   ХЕЛПЕРЫ
   ============================================================ */
function skinUrl(p, size) {
  const key = (p.uuid && p.uuid.trim()) ? p.uuid.trim() : p.name;
  return `https://mc-heads.net/avatar/${encodeURIComponent(key)}/${size}`;
}
function skinFallback(p) {
  return `https://mc-heads.net/avatar/${encodeURIComponent(p.name)}/128`;
}
function tierClass(t) { return "tier-" + String(t).toUpperCase(); }
function normalTierFromRetired(rt) {
  // RHT1 -> HT1, RLT2 -> LT2
  if (rt && rt.startsWith("R") && rt.length >= 4) return rt.substring(1);
  return null;
}
function tierRank(t) {
  if (!t) return 999;
  if (t.startsWith("R")) {
    const n = normalTierFromRetired(t);
    const i = RETIRED_ORDER.indexOf(t);
    return 200 + (i === -1 ? 99 : i);
  }
  const i = TIER_ORDER.indexOf(t);
  return i === -1 ? 999 : i;
}
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}
function pointsForTier(t) {
  if (!t) return 0;
  const normal = t.startsWith("R") ? normalTierFromRetired(t) : t;
  return TIER_POINTS[normal] || 0;
}

/* ============================================================
   ПЛАВНЫЙ ПЕРЕХОД МЕЖДУ СТРАНИЦАМИ
   ============================================================ */
let isAnimating = false;
function switchPage(hideId, showId, afterSwitch) {
  if (isAnimating) return;
  isAnimating = true;
  const hideEl = document.getElementById(hideId);
  const showEl = document.getElementById(showId);
  hideEl.classList.add("leaving");
  setTimeout(() => {
    hideEl.classList.add("hidden");
    hideEl.classList.remove("leaving");
    showEl.classList.remove("hidden");
    showEl.classList.add("entering");
    void showEl.offsetWidth;
    showEl.classList.remove("entering");
    window.scrollTo({ top: 0, behavior: "auto" });
    setTimeout(() => {
      isAnimating = false;
      if (afterSwitch) afterSwitch();
    }, 400);
  }, 350);
}
function goHome(e) {
  if (e) e.preventDefault();
  const board = document.getElementById("boardPage");
  if (board.classList.contains("hidden")) return;
  switchPage("boardPage", "heroPage");
}
function goBoard(e) {
  if (e) e.preventDefault();
  const hero = document.getElementById("heroPage");
  if (hero.classList.contains("hidden")) {
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  switchPage("heroPage", "boardPage", renderBoard);
}

/* ============================================================
   ЗАГРУЗКА ДАННЫХ
   ============================================================ */
async function loadPlayers() {
  try {
    const resp = await fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    if (!Array.isArray(data)) throw new Error("Не массив");
    const newStr = JSON.stringify(data);
    const oldStr = JSON.stringify(PLAYERS);
    PLAYERS = data;
    loadedOnce = true;
    const board = document.getElementById("boardPage");
    if (!board.classList.contains("hidden") && newStr !== oldStr) {
      renderBoard();
    }
  } catch (e) {
    console.warn("Не удалось загрузить players.json:", e);
    if (!loadedOnce) {
      document.getElementById("boardList").innerHTML = `
        <div class="state-box">
          <h3>Не удалось загрузить данные</h3>
          <p>Бот ещё не создал <code>players.json</code>. Попробуй позже.</p>
        </div>`;
    }
  }
}

/* ============================================================
   ИКОНКА МЕЧА (для тир-бейджа)
   ============================================================ */
const SWORD_SVG = `<svg viewBox="0 0 24 24"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/></svg>`;

function makeTierBadge(tier) {
  // tier: "HT1" / "RHT1" / null
  if (!tier) {
    const b = document.createElement("div");
    b.className = "no-tier-badge";
    b.textContent = "Без тира";
    return b;
  }
  const wrap = document.createElement("div");
  wrap.className = "tier-badge " + tierClass(tier);

  const circle = document.createElement("div");
  circle.className = "tier-circle";
  circle.innerHTML = SWORD_SVG;

  const rect = document.createElement("div");
  rect.className = "tier-rect";
  rect.textContent = tier;

  wrap.appendChild(circle);
  wrap.appendChild(rect);
  return wrap;
}

/* ============================================================
   КАРТОЧКА ИГРОКА
   ============================================================ */
function buildCard(p, rank) {
  const card = document.createElement("div");
  card.className = "player-card";
  card.dataset.playerName = p.name;

  // Место (только у активных и retired)
  if (rank && rank > 0) {
    const rk = document.createElement("div");
    rk.className = "rank-num" + (rank === 1 ? " top-1" : rank === 2 ? " top-2" : rank === 3 ? " top-3" : "");
    rk.textContent = rank + ".";
    card.appendChild(rk);
  }

  // Скин
  const skin = document.createElement("div");
  skin.className = "skin-wrap";
  const img = document.createElement("img");
  img.alt = p.name;
  img.loading = "lazy";
  img.src = skinUrl(p, 128);
  img.onerror = function () { this.onerror = null; this.src = skinFallback(p); };
  skin.appendChild(img);

  // Инфа
  const info = document.createElement("div");
  info.className = "player-info";

  const name = document.createElement("div");
  name.className = "player-name" + (rank && rank > 0 ? "" : " no-rank");
  name.textContent = p.name;

  info.appendChild(name);
  info.appendChild(makeTierBadge(p.tier));

  card.appendChild(skin);
  card.appendChild(info);

  // Клик → модалка
  card.addEventListener("click", () => openModal(p));

  return card;
}

/* ============================================================
   РЕНДЕР ЛИДЕРБОРДА
   ============================================================ */
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    if (entry.isIntersecting) {
      entry.target.classList.add("visible");
      revealObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.05, rootMargin: "0px 0px -40px 0px" });

function makeDivider(labelText, cls) {
  const d = document.createElement("div");
  d.className = "section-divider";
  d.innerHTML = `<div class="line"></div><div class="label ${cls || ""}">${labelText}</div><div class="line"></div>`;
  return d;
}

function renderBoard() {
  const list = document.getElementById("boardList");
  list.innerHTML = "";

  // Активные — status === "active" и tier без R
  const active = PLAYERS
    .filter(p => p.status === "active" && p.tier && !p.tier.startsWith("R"))
    .sort((a, b) => {
      const d = tierRank(a.tier) - tierRank(b.tier);
      return d !== 0 ? d : (b.points || 0) - (a.points || 0);
    });

  // Без тира
  const noTier = PLAYERS
    .filter(p => p.status === "none" || (!p.tier && p.status !== "retired"))
    .sort((a, b) => a.name.localeCompare(b.name));

  // Retired — status === "retired" ИЛИ tier начинается с R
  const retired = PLAYERS
    .filter(p => p.status === "retired" || (p.tier && p.tier.startsWith("R")))
    .sort((a, b) => {
      const d = tierRank(a.tier) - tierRank(b.tier);
      return d !== 0 ? d : (b.points || 0) - (a.points || 0);
    });

  if (active.length) {
    list.appendChild(makeDivider("Активные", "active-label"));
    const grid = document.createElement("div");
    grid.className = "player-grid";
    active.forEach((p, i) => {
      const c = buildCard(p, i + 1);
      grid.appendChild(c);
      revealObserver.observe(c);
    });
    list.appendChild(grid);
  }

  if (noTier.length) {
    list.appendChild(makeDivider("Без тира", "none-label"));
    const grid = document.createElement("div");
    grid.className = "player-grid";
    noTier.forEach(p => {
      const c = buildCard(p, 0);
      grid.appendChild(c);
      revealObserver.observe(c);
    });
    list.appendChild(grid);
  }

  if (retired.length) {
    list.appendChild(makeDivider("Retired", ""));
    const grid = document.createElement("div");
    grid.className = "player-grid";
    retired.forEach((p, i) => {
      const c = buildCard(p, i + 1);
      grid.appendChild(c);
      revealObserver.observe(c);
    });
    list.appendChild(grid);
  }

  if (!active.length && !noTier.length && !retired.length) {
    list.innerHTML = `
      <div class="state-box">
        <h3>Данных пока нет</h3>
        <p>Бот ещё не синхронизировал игроков. Обнови страницу позже.</p>
      </div>`;
  }
}

/* ============================================================
   МОДАЛКА
   ============================================================ */
const modalOverlay = document.getElementById("modalOverlay");
const modalBox = document.getElementById("modalBox");

function openModal(p) {
  const pts = p.points || pointsForTier(p.tier);
  const statusLabel =
    p.status === "active" ? "Активный" :
    p.status === "retired" ? "Retired" : "Без тира";
  const statusClass =
    p.status === "active" ? "status-active" :
    p.status === "retired" ? "status-retired" : "status-none";

  modalBox.innerHTML = "";

  // Кнопка закрытия
  const close = document.createElement("button");
  close.className = "modal-close";
  close.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
  close.onclick = closeModal;
  modalBox.appendChild(close);

  // Шапка
  const header = document.createElement("div");
  header.className = "modal-header";
  const mskin = document.createElement("div");
  mskin.className = "modal-skin";
  const mimg = document.createElement("img");
  mimg.alt = p.name;
  mimg.src = skinUrl(p, 160);
  mimg.onerror = function () { this.onerror = null; this.src = skinFallback(p); };
  mskin.appendChild(mimg);

  const hinfo = document.createElement("div");
  const hname = document.createElement("div");
  hname.className = "modal-name";
  hname.textContent = p.name;
  const hdisc = document.createElement("div");
  hdisc.className = "modal-discord";
  hdisc.textContent = "@" + (p.discord || p.name);
  hinfo.appendChild(hname);
  hinfo.appendChild(hdisc);

  header.appendChild(mskin);
  header.appendChild(hinfo);
  modalBox.appendChild(header);

  // Тир
  const tierBlock = document.createElement("div");
  tierBlock.className = "modal-tier";
  const tierMain = document.createElement("div");
  tierMain.className = "modal-tier-main";
  const tierLabel = document.createElement("div");
  tierLabel.className = "modal-tier-label";
  tierLabel.textContent = "Тир · Sword";
  tierMain.appendChild(tierLabel);
  tierMain.appendChild(makeTierBadge(p.tier));
  tierBlock.appendChild(tierMain);
  modalBox.appendChild(tierBlock);

  // Поинты
  const pointsBlock = document.createElement("div");
  pointsBlock.className = "modal-points";
  pointsBlock.innerHTML = `
    <div class="modal-points-label">Поинты</div>
    <div class="modal-points-value">${pts}<small>pts</small></div>
  `;
  modalBox.appendChild(pointsBlock);

  // Статус
  const statusBlock = document.createElement("div");
  statusBlock.className = "modal-status";
  statusBlock.innerHTML = `
    <div class="modal-status-label">Статус</div>
    <div class="modal-status-badge ${statusClass}">${statusLabel}</div>
  `;
  modalBox.appendChild(statusBlock);

  modalOverlay.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  modalOverlay.classList.remove("open");
  document.body.style.overflow = "";
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
});

/* ============================================================
   ПОИСК
   ============================================================ */
const heroSearch = document.getElementById("heroSearch");
const heroResults = document.getElementById("heroSearchResults");

heroSearch.addEventListener("input", () => {
  const q = heroSearch.value.trim().toLowerCase();
  if (!q) { heroResults.classList.remove("open"); heroResults.innerHTML = ""; return; }

  const matches = PLAYERS.filter(p =>
    p.name.toLowerCase().includes(q) || (p.discord && p.discord.toLowerCase().includes(q))
  ).slice(0, 8);

  heroResults.innerHTML = "";

  if (!matches.length) {
    heroResults.innerHTML = `<div class="search-empty">Игрок не найден</div>`;
    heroResults.classList.add("open");
    return;
  }

  matches.forEach(p => {
    const item = document.createElement("div");
    item.className = "search-item";

    const img = document.createElement("img");
    img.alt = p.name;
    img.src = skinUrl(p, 64);
    img.onerror = function () { this.onerror = null; this.src = skinFallback(p); };

    const name = document.createElement("div");
    name.className = "search-item-name";
    name.textContent = p.name;

    const tierEl = document.createElement("div");
    if (p.status === "retired" || (p.tier && p.tier.startsWith("R"))) {
      tierEl.className = "search-item-tier retired";
      tierEl.textContent = p.tier || "RETIRED";
    } else if (p.status === "none" || !p.tier) {
      tierEl.className = "search-item-tier none";
      tierEl.textContent = "БЕЗ ТИРА";
    } else {
      tierEl.className = "search-item-tier";
      tierEl.textContent = p.tier;
    }

    item.appendChild(img);
    item.appendChild(name);
    item.appendChild(tierEl);

    item.addEventListener("click", () => {
      heroSearch.value = "";
      heroResults.classList.remove("open");
      goBoard();
      setTimeout(() => {
        const el = document.querySelector(`[data-player-name="${p.name}"]`);
        if (el) {
          el.scrollIntoView({ behavior: "smooth", block: "center" });
          el.classList.add("flash");
          setTimeout(() => el.classList.remove("flash"), 2000);
        }
      }, 900);
    });

    heroResults.appendChild(item);
  });

  heroResults.classList.add("open");
});

document.addEventListener("click", (e) => {
  if (!heroSearch.contains(e.target) && !heroResults.contains(e.target)) {
    heroResults.classList.remove("open");
  }
});

/* ============================================================
   СТАРТ
   ============================================================ */
(async function init() {
  await loadPlayers();
  renderBoard();
  setInterval(loadPlayers, AUTO_REFRESH_MS);
})();
</script>
</body>
